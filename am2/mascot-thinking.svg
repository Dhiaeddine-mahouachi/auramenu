<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Animated AuraMenu cloche mascot" class="buddy" data-state="thinking" xmlns:c2pa="http://c2pa.org/manifest">
<defs><style>
.buddy{overflow:visible;--ink:#26171a;--wine:#762039;--gold:#f9c348;--steam:#d76a3f}
.shadow{fill:#6e2037;opacity:.12;transform-origin:120px 192px;animation:shadow 2.5s ease-in-out infinite}
.character{transform-origin:120px 156px;animation:breathe 2.5s ease-in-out infinite}
.leg,.arm{fill:none;stroke:var(--ink);stroke-width:4.1;stroke-linecap:round;stroke-linejoin:round}
.arm-l{transform-origin:59px 136px}.arm-r{transform-origin:181px 136px}.leg-l{transform-origin:92px 158px}.leg-r{transform-origin:148px 158px}
.steam path{fill:none;stroke:var(--steam);stroke-width:4.4;stroke-linecap:round;animation:steam 2.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.steam path:nth-child(2){animation-delay:-.8s}.steam path:nth-child(3){animation-delay:-1.5s}
.eye{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}.face{transform-origin:120px 126px}.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.sparkles,.thought,.sleepy{opacity:0}.sparkles{transform-origin:120px 112px}
[data-state="wave"] .arm-r{animation:wave .75s ease-in-out infinite}[data-state="wave"] .character{animation:breathe 2s ease-in-out infinite}
[data-state="walk"] .leg-l,[data-state="walk"] .arm-r{animation:stride .66s ease-in-out infinite alternate}[data-state="walk"] .leg-r,[data-state="walk"] .arm-l{animation:stride .66s ease-in-out infinite alternate-reverse}[data-state="walk"] .character{animation:step .66s ease-in-out infinite}
[data-state="run"] .leg-l,[data-state="run"] .arm-r{animation:stride .28s ease-in-out infinite alternate}[data-state="run"] .leg-r,[data-state="run"] .arm-l{animation:stride .28s ease-in-out infinite alternate-reverse}[data-state="run"] .character{animation:dash .56s ease-in-out infinite}
[data-state="jump"] .character{animation:jump 1.25s cubic-bezier(.45,0,.55,1) infinite}[data-state="jump"] .shadow{animation:land 1.25s ease-in-out infinite}
[data-state="loading"] .character{animation:loading 1.7s ease-in-out infinite}[data-state="loading"] .steam path{animation-duration:1.1s}
[data-state="celebrate"] .character{animation:jump .95s ease-in-out infinite}[data-state="celebrate"] .sparkles{animation:twinkle .95s ease-in-out infinite}[data-state="celebrate"] .shadow{animation:land .95s ease-in-out infinite}
[data-state="thinking"] .character{animation:think 2.2s ease-in-out infinite}[data-state="thinking"] .thought{animation:twinkle 2.2s ease-in-out infinite}[data-state="thinking"] .arm-r{transform:rotate(-38deg)}
[data-state="sleep"] .character{animation:breathe 3.5s ease-in-out infinite}[data-state="sleep"] .sleepy{animation:steam 3s ease-in-out infinite}[data-state="sleep"] .mouth{opacity:0}[data-state="sleep"] .sleep-mouth{opacity:1}.sleep-mouth{opacity:0}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.015,.985)}}
@keyframes shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.96)}}
@keyframes steam{0%{opacity:.25;transform:translateY(3px)}45%{opacity:1}100%{opacity:.25;transform:translateY(-5px)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.2)}}
@keyframes wave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-42deg)}}
@keyframes stride{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dash{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(-9px) rotate(9deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}14%{transform:translateY(1px) scale(1.07,.93)}48%{transform:translateY(-28px) scale(.97,1.03)}82%{transform:translateY(0) scale(1.06,.94)}}
@keyframes land{0%,100%{transform:scaleX(1);opacity:.12}48%{transform:scaleX(.65);opacity:.05}}
@keyframes loading{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes think{0%,100%{transform:rotate(0)}45%,65%{transform:rotate(-6deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.85)}40%,70%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<ellipse class="shadow" cx="120" cy="192" rx="69" ry="6"/>
<g class="character">
<g class="steam"><path d="M100 53 C91 45 104 40 98 31"/><path d="M120 48 C112 40 125 35 119 25"/><path d="M140 53 C132 45 145 40 138 31"/></g>
<g class="leg leg-l"><path d="M92 158 L87 176 Q85 181 88 181 H104"/></g><g class="leg leg-r"><path d="M148 158 L155 181 H138"/></g>
<g class="arm arm-l"><path d="M59 136 Q41 133 42 115 M42 117 L37 112 M42 117 L47 109"/></g><g class="arm arm-r"><path d="M181 136 Q199 133 198 115 M198 117 L193 110 M198 117 L204 111"/></g>
<path d="M111 72 Q111 59 120 59 Q129 59 129 72" fill="#762039" stroke="#26171a" stroke-width="4.3"/>
<path d="M55 140 C62 99 87 70 120 70 C154 70 178 99 185 140 Z" fill="#f9c348" stroke="#26171a" stroke-width="4.4" stroke-linejoin="round"/>
<path d="M70 120 Q79 96 101 84" fill="none" stroke="#fff4de" stroke-width="6" stroke-linecap="round"/>
<g class="face"><path class="eye" d="M100 106 Q106 97 112 106"/><path class="eye" d="M128 106 Q134 97 140 106"/><circle cx="94" cy="119" r="5.3" fill="#f5ae92"/><circle cx="146" cy="119" r="5.3" fill="#f5ae92"/><path class="mouth" d="M106 117 Q120 133 134 117" stroke="#26171a" stroke-width="4.2" stroke-linecap="round" fill="#762039"/><path class="sleep-mouth" d="M116 119 Q120 115 124 119" fill="none" stroke="#26171a" stroke-width="3" stroke-linecap="round"/></g>
<rect x="45" y="137" width="150" height="20" rx="9" fill="#762039" stroke="#26171a" stroke-width="4.3"/>
<g class="sparkles" fill="#f9c348" stroke="#d76a3f" stroke-width="1.5"><path d="M35 74 l3 9 9 3 -9 3 -3 9 -3-9 -9-3 9-3z"/><path d="M205 67 l3 10 10 3 -10 3 -3 10 -3-10 -10-3 10-3z"/></g>
<g class="thought" fill="#762039"><circle cx="185" cy="75" r="3"/><circle cx="196" cy="64" r="4"/><circle cx="208" cy="51" r="5"/></g><g class="sleepy" fill="#762039" font-family="Arial,sans-serif" font-weight="bold"><text x="176" y="77" font-size="13">z</text><text x="191" y="65" font-size="18">Z</text></g>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>